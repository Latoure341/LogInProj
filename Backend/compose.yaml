version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=mongodb://db:27017/loginproj
    depends_on:
      - db

  db:
    image: mongo:6
    restart: always
    volumes:
      - db-data:/data/db

volumes:
  db-data: {}
